name: Android 12 System App CI

on:
  push:
    branches:
      - feature/android12-system-app
  pull_request:
    branches:
      - "运行性能问题查找前"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Validate system-app XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("system-app/privapp-permissions-com.punch.app.xml")
          print("system-app XML OK")
          PY
