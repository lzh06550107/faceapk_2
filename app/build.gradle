plugins {
    id 'com.android.application'
}

android {
    namespace 'com.punch.app'
    compileSdk 34
    testBuildType "smoke"

    defaultConfig {
        applicationId "com.punch.app"
        minSdk 24
        targetSdk 34
        versionCode 200
        versionName "2.0.0"
        multiDexEnabled true
        testInstrumentationRunner "com.punch.app.test.UiSmokeTestRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
        smoke {
            initWith debug
            debuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".smoke"
            versionNameSuffix "-smoke"
            matchingFallbacks = ['debug']
        }
        deviceOwnerTest {
            initWith debug
            debuggable true
            signingConfig signingConfigs.debug
            versionNameSuffix "-device-owner-test"
            matchingFallbacks = ['debug']
        }
        cameraFaceSoak {
            initWith debug
            debuggable true
            signingConfig signingConfigs.debug
            versionNameSuffix "-camera-face-soak"
            matchingFallbacks = ['debug']
        }
        facePunchStress {
            initWith debug
            debuggable true
            signingConfig signingConfigs.debug
            versionNameSuffix "-face-punch-stress"
            matchingFallbacks = ['debug']
        }
        networkFaultTest {
            initWith debug
            debuggable true
            signingConfig signingConfigs.debug
            versionNameSuffix "-network-fault-test"
            matchingFallbacks = ['debug']
        }
        dbStressTest {
            initWith debug
            debuggable true
            signingConfig signingConfigs.debug
            versionNameSuffix "-db-stress-test"
            matchingFallbacks = ['debug']
        }
        processRecoveryTest {
            initWith debug
            debuggable true
            signingConfig signingConfigs.debug
            versionNameSuffix "-process-recovery-test"
            matchingFallbacks = ['debug']
        }
        cameraFaceRecoveryTest {
            initWith debug
            debuggable true
            signingConfig signingConfigs.debug
            versionNameSuffix "-camera-face-recovery-test"
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libbdface.so'
        pickFirst 'lib/armeabi-v7a/libbdface.so'
        pickFirst 'lib/x86/libbdface.so'
        excludes += ['META-INF/DEPENDENCIES']
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    testOptions {
        animationsDisabled = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    debugImplementation 'androidx.fragment:fragment-testing:1.6.2'

    implementation 'androidx.sqlite:sqlite:2.4.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    testImplementation files('test-libs/junit-4.13.2.jar')
    testImplementation files('test-libs/hamcrest-core-1.3.jar')

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
